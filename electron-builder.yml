appId: org.recto.app
productName: Recto
copyright: Copyright © 2026 Recto contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE
  - NOTICE.md
  - "!**/*.map"
asar: true
# Only English Chromium UI strings ship: Recto's own interface is English, and
# the other locales add about 40 MB. Book languages are unaffected.
electronLanguages: [en-US, en-GB]
fileAssociations:
  - ext: recto
    name: Recto book
    description: Recto book
    mimeType: application/x-recto
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Recto-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Recto
  license: LICENSE
  deleteAppDataOnUninstall: false
# macOS builds are ad-hoc signed, not notarized (that needs a paid Apple
# Developer account). Apple Silicon refuses to run unsigned code at all, and
# an ad-hoc signature is enough for "Open Anyway" in Privacy & Security.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: build/icon.png
  identity: '-'
  hardenedRuntime: false
  darkModeSupport: true
  artifactName: Recto-${version}-mac-${arch}.${ext}
dmg:
  title: Recto ${version}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Office
  icon: build/icon.png
  executableName: recto
  synopsis: Open-source book formatter for EPUB and print-ready PDF
  maintainer: Recto contributors <308798850+fsiuhgshiqoih32@users.noreply.github.com>
  vendor: Recto contributors
  desktop:
    entry:
      StartupWMClass: Recto
  artifactName: Recto-${version}-linux-${arch}.${ext}
