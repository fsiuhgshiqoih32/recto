name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The print checks typeset Japanese, which relies on system CJK fonts.
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Print layout checks (renders sample books to PDF)
        run: npm run test:pdf -- --all
        env:
          RECTO_BROWSER: chromium
      - name: Keep the sample PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: out/*.pdf
          if-no-files-found: ignore

  epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build sample EPUBs and validate them with epubcheck-ts
        run: npm run test:epub
      - name: Validate with the official EPUBCheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          for book in out/epub-*.epub; do java -jar epubcheck-5.4.0/epubcheck.jar --failonwarnings "$book"; done
      - name: Check accessibility with DAISY Ace
        run: |
          # Ace drives Chrome, whose sandbox Ubuntu 24.04 blocks by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install --global @daisy/ace@1.4.6
          for book in out/epub-*.epub; do
            # Exit 2 means accessibility violations; anything else, Ace itself failed. Either way, say why.
            # Ace runs in Electron, which needs a display.
            if ! xvfb-run --auto-servernum ace --force --exiterror2 --subdir --outdir out/ace "$book" > ace.log 2>&1; then
              echo "::error title=DAISY Ace failed on $book::$(tail -c 1500 ace.log | tr '\n' ' ')"
              exit 1
            fi
          done
      - name: Keep the EPUBs and accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-epubs
          path: |
            out/*.epub
            out/ace
          if-no-files-found: ignore

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            app: release/win-unpacked/Recto.exe
          - os: macos-latest
            app: release/mac-arm64/Recto.app/Contents/MacOS/Recto
          - os: ubuntu-latest
            app: release/linux-unpacked/recto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop app tests (Electron)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npm run test:desktop
      - name: Build the installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the packaged app
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum ' || '' }}npx playwright test --config playwright.desktop.config.ts
        env:
          RECTO_APP: ${{ github.workspace }}/${{ matrix.app }}
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*-mac-*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
